apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  labels:
    app: {{ .Chart.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  # Recreate (not RollingUpdate) because the PVC is ReadWriteOnce — two
  # pods can't mount it simultaneously during a rollout.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
      component: app
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
        component: app
    spec:
      containers:
      - name: {{ .Chart.Name }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.service.port }}
          protocol: TCP
        env:
        - name: DATABASE_PATH
          value: {{ .Values.sqlite.databasePath }}
        # CEREBRAS_API_KEY + GEMINI_API_KEY live in the resume-site-secrets
        # Secret seeded out-of-band by
        # lab-iac/ansible/playbooks/seed-app-secrets.yml (--tags resume-site).
        # The key names in the Secret match the env vars verbatim, so
        # envFrom.secretRef exposes them directly.
        envFrom:
          - secretRef:
              name: resume-site-secrets
        {{- if .Values.sqlite.persistence.enabled }}
        volumeMounts:
        - name: sqlite-data
          mountPath: /app/db
        {{- end }}
        # First-pod startup seeds markdown data + generates Gemini embeddings
        # for every row; that can take 30-60s on a cold PVC. Generous
        # initialDelaySeconds so liveness doesn't kill mid-seed.
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 90
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 15
          periodSeconds: 5
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
      {{- if .Values.sqlite.persistence.enabled }}
      volumes:
      - name: sqlite-data
        persistentVolumeClaim:
          claimName: {{ .Chart.Name }}-sqlite-pvc
      {{- end }}
